
<div style="padding: 1rem 0;">
  <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; font-size: 12px; color: var(--color-text-secondary);">
    <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #185FA5;"></span>Police</span>
    <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #D85A30;"></span>Fire & emergency</span>
    <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #1D9E75;"></span>Behavioral health</span>
  </div>
  <div style="position: relative; width: 100%; height: 340px;">
    <canvas id="safetyChart" role="img" aria-label="Horizontal bar chart of SF public safety line items. HealthRight 360 at $38.6M is largest, followed by SFPD overtime at $34.4M.">HealthRight 360 $38.6M, SFPD overtime $34.4M, RESET Center $14.5M, Fire/DEM/PUC overtime $10.4M, Prop 47 grant $7.96M, COPS grant $6.25M, DMACC grant $1.12M.</canvas>
  </div>

  <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 6px;" id="notes"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const items = [
  { label: 'HealthRight 360 contract', amount: 38.6, color: '#1D9E75', desc: 'Extends withdrawal management and residential treatment services through June 2028.' },
  { label: 'SFPD overtime re-appropriation', amount: 34.4, color: '#185FA5', desc: 'Shifts funds within SFPD budget from salaries to overtime to cover projected overruns in FY2025–26.' },
  { label: 'RESET Center contract', amount: 14.5, color: '#1D9E75', desc: 'Funds ConnectionsCA to operate a safe diversion facility for people picked up for intoxication or drug use — an alternative to jail.' },
  { label: 'Overtime: Fire, DEM & PUC', amount: 10.4, color: '#D85A30', desc: 'Covers projected overtime overruns across the Fire Department, Dept. of Emergency Management, and Public Utilities Commission.' },
  { label: 'Prop 47 DPH grant', amount: 7.96, color: '#1D9E75', desc: 'State grant to the Dept. of Public Health for drug treatment and diversion services through June 2029.' },
  { label: 'COPS hiring grant', amount: 6.25, color: '#185FA5', desc: 'Federal grant funds 50 new SFPD officer positions, added to the Annual Salary Ordinance.' },
  { label: 'DMACC tobacco grant', amount: 1.12, color: '#185FA5', desc: 'State DOJ grant funds the Drug Market Agency Coordination Center — personnel and operations through June 2029.' }
];

new Chart(document.getElementById('safetyChart'), {
  type: 'bar',
  data: {
    labels: items.map(i => i.label),
    datasets: [{
      data: items.map(i => i.amount),
      backgroundColor: items.map(i => i.color),
      borderWidth: 0,
      borderRadius: 3
    }]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: (ctx) => ' $' + ctx.parsed.x.toFixed(2) + 'M'
        }
      }
    },
    scales: {
      x: {
        ticks: { callback: (v) => '$' + v + 'M', color: '#888780', font: { size: 11 } },
        grid: { color: 'rgba(136,135,128,0.15)' },
        border: { display: false }
      },
      y: {
        ticks: { color: '#5F5E5A', font: { size: 12 }, autoSkip: false },
        grid: { display: false },
        border: { display: false }
      }
    }
  }
});

const notesEl = document.getElementById('notes');
items.forEach((item, i) => {
  const row = document.createElement('div');
  row.style.cssText = 'display: flex; gap: 10px; align-items: baseline; font-size: 12px; line-height: 1.5;';
  row.innerHTML = `
    <span style="display: flex; align-items: center; gap: 5px; white-space: nowrap; color: var(--color-text-primary); font-weight: 500; min-width: 16px;">
      <span style="width: 8px; height: 8px; border-radius: 2px; background: ${item.color}; display: inline-block; flex-shrink: 0;"></span>
      $${item.amount}M
    </span>
    <span style="color: var(--color-text-secondary);"><span style="color: var(--color-text-primary); font-weight: 500;">${item.label}.</span> ${item.desc}</span>
  `;
  notesEl.appendChild(row);
});
</script>
